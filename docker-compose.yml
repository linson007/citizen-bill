services:
  postgres:
    image: postgres:16-alpine
    container_name: citizen-bill-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: citizen_bill
      POSTGRES_PASSWORD: citizen_bill_password
      POSTGRES_DB: citizen_bill
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U citizen_bill -d citizen_bill"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
